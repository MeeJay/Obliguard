# conf.d/default.conf of the client container (nginx:alpine includes it inside
# its http{} block, so `map` is valid here).

# WebSocket-aware Connection header: "upgrade" for an upgrade request (agent
# command channel, Socket.io), "" otherwise (plain keep-alive request).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Forwarded headers ───────────────────────────────────────────────────
    # Every proxied location sets X-Forwarded-For with $proxy_add_x_forwarded_for:
    # the address nginx saw is APPENDED, so the right-most entry is always ours
    # and a client-written X-Forwarded-For can only fill the left-hand side.
    # The server resolves the client from the right (server/src/utils/clientIp.ts,
    # TRUSTED_PROXIES / TRUSTED_PROXY_HOPS) and Express 'trust proxy' 1 keys
    # rate limits on that right-most entry. X-Forwarded-Proto is passed through
    # from the edge TLS proxy (this container only speaks HTTP), as in Obliance.

    # ── SPA security headers ────────────────────────────────────────────────
    # Set on the SPA locations only (/, /index.html, static assets): the API
    # sets its own through helmet (server/src/app.ts). add_header is not
    # inherited by a location that has its own add_header, hence the repeats.
    # script-src hashes: the inline theme bootstrap of client/index.html in its
    # LF and CRLF checkouts — keep in sync with SPA_INLINE_SCRIPT_HASHES in
    # server/src/app.ts (checked by server/test/suites/43-edge-hardening).

    # Obligate SSO callback (server-side redirect + code exchange)
    location /auth/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Never pass a client-supplied X-Forwarded-Host through to the server.
        proxy_set_header X-Forwarded-Host $host;
    }

    # Agent hot path (HTTP push + command WebSocket /api/agent/ws). Longest
    # prefix wins, so this is chosen over /api/ for agent traffic.
    location /api/agent/ {
        access_log off;
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        # The command channel is a long-lived WebSocket (30 s heartbeats).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API proxy (everything else under /api)
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Never pass a client-supplied X-Forwarded-Host through to the server.
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io proxy (browser real-time channel)
    location /socket.io/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check endpoint proxy
    location /health {
        access_log off;
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Desktop app downloads — proxied to Express which serves from desktop-app/dist/
    # Must be listed before the SPA fallback or Nginx would serve index.html instead.
    location /downloads/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Allow large binary downloads without buffering issues
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-UAt1TA4dj9WHPn3IsId7EFCCnvVMwrMWXeWzs57RsdA=' 'sha256-7qSUcOl1E9dChPq3la8F8WRTFx+ho2HCMmsB8OevM7w='; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated: it references content-hashed
    # bundles that disappear on every deploy. The try_files fallback above and
    # the `index` directive both internally redirect here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-UAt1TA4dj9WHPn3IsId7EFCCnvVMwrMWXeWzs57RsdA=' 'sha256-7qSUcOl1E9dChPq3la8F8WRTFx+ho2HCMmsB8OevM7w='; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-UAt1TA4dj9WHPn3IsId7EFCCnvVMwrMWXeWzs57RsdA=' 'sha256-7qSUcOl1E9dChPq3la8F8WRTFx+ho2HCMmsB8OevM7w='; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
